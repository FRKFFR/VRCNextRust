[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
vrc-api = { path = "crates/vrc-api", version = "0.1.0" }
vrc-pipeline = { path = "crates/vrc-pipeline", version = "0.1.0" }
vrc-store = { path = "crates/vrc-store", version = "0.1.0" }
vrc-logs = { path = "crates/vrc-logs", version = "0.1.0" }
vrc-osc = { path = "crates/vrc-osc", version = "0.1.0" }
vrc-launcher = { path = "crates/vrc-launcher", version = "0.1.0" }
vrc-core = { path = "crates/core", version = "0.1.0" }
ui-egui = { path = "crates/ui-egui", version = "0.1.0" }

# External dependencies (versions verified >=14 days old on crates.io)
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6", features = ["derive"] }
eframe = "0.37"
egui = "0.37"
reqwest = { version = "0.13", features = ["rustls-tls", "cookies", "json"] }
reqwest_cookie_store = "0.10"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
rosc = "0.11"
notify = "8"
keyring = "4"
directories = "6"
time = "0.3"
secrecy = "0.10"
wiremock = "0.6"
tokio-test = "0.4"
tempfile = "3"
