[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
vrc-api = { path = "crates/vrc-api", version = "0.1.0" }
vrc-pipeline = { path = "crates/vrc-pipeline", version = "0.1.0" }
vrc-store = { path = "crates/vrc-store", version = "0.1.0" }
vrc-logs = { path = "crates/vrc-logs", version = "0.1.0" }
vrc-osc = { path = "crates/vrc-osc", version = "0.1.0" }
vrc-launcher = { path = "crates/vrc-launcher", version = "0.1.0" }
vrc-core = { path = "crates/core", version = "0.1.0" }
ui-egui = { path = "crates/ui-egui", version = "0.1.0" }

# External dependencies: exact pins, each published >=14 days before adoption
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
clap = { version = "=4.6.7", features = ["derive"] }
eframe = "=0.37.0"
egui = "=0.37.0"
reqwest = { version = "=0.13.5", features = ["rustls", "cookies", "json"] }
reqwest_cookie_store = "=0.10.0"
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rusqlite_migration = "=2.6.0"
rosc = "=0.11.4"
notify = "=8.2.0"
keyring = "=4.2.0"
directories = "=6.0.0"
time = "=0.3.55"
secrecy = "=0.10.3"
futures-util = "=0.3.34"
rpassword = "=7.5.4"
wiremock = "=0.6.5"
tokio-test = "=0.4.6"
tempfile = "=3.27.0"
